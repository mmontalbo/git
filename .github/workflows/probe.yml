name: CI-probe-old
on: [push, pull_request]

# BEFORE state (pre-patch): group everything by github.sha, no cancel.
concurrency:
  group: ${{ github.sha }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: identify
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "pr_number=${{ github.event.pull_request.number }}"
          echo "group=${{ github.sha }}"
      - name: dwell
        run: sleep 180
