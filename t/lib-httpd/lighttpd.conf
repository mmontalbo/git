# Minimal lighttpd configuration for Git's HTTP tests.
#
# This is the lighttpd counterpart to lib-httpd/apache.conf. It covers the
# smart and dumb HTTP protocols, basic auth, redirects and, when
# LIB_HTTPD_SSL is set, TLS with HTTP/2 over ALPN. WebDAV, Subversion and
# proxy remain Apache-only; lib-httpd.sh refuses the lighttpd backend when a
# test asks for one of them.
#
# Dynamic values (listening port and filesystem paths) are taken from the
# environment that lib-httpd.sh exports before starting the server.

server.modules = (
	"mod_accesslog",
	"mod_alias",
	"mod_redirect",
	"mod_setenv",
	"mod_auth",
	"mod_authn_file",
	"mod_cgi",
)

server.bind          = "127.0.0.1"
include_shell "echo server.port = $LIB_HTTPD_PORT"

# TLS + HTTP/2: lib-httpd.sh generates this snippet, which is empty unless
# the suite requested SSL. lighttpd offers HTTP/2 over TLS via ALPN by
# default, so this also exercises git's h2 client against lighttpd's stack.
include_shell "cat \"$HTTPD_ROOT_PATH/lighttpd-ssl.conf\" 2>/dev/null || true"

server.document-root = env.HTTPD_DOCUMENT_ROOT_PATH
server.pid-file      = env.HTTPD_ROOT_PATH + "/httpd.pid"
server.errorlog      = env.HTTPD_ROOT_PATH + "/error.log"
accesslog.filename   = env.HTTPD_ROOT_PATH + "/access.log"

# Basic auth. The suite's passwd file is in Apache $apr1$ format, which
# lighttpd's htpasswd backend also understands.
auth.backend                   = "htpasswd"
auth.backend.htpasswd.userfile = env.HTTPD_ROOT_PATH + "/passwd"

# Redirects: git must follow these to the real smart path. Permanent is the
# default; the temporary variant overrides the code within its own scope.
url.redirect-code = 301
url.redirect = ( "^/smart-redir-perm/(.*)" => "/smart/$1" )
$HTTP["url"] =~ "^/smart-redir-temp" {
	url.redirect-code = 302
	url.redirect = ( "^/smart-redir-temp/(.*)" => "/smart/$1" )
}

# Serve repositories as static files for the dumb HTTP protocol, and route
# /smart/ (and its authenticated /auth/smart/ variant) through
# git-http-backend as a CGI. This mirrors the layout apache.conf exposes,
# so the same test URLs work against either backend.
alias.url = (
	"/dumb/"           => env.HTTPD_DOCUMENT_ROOT_PATH + "/",
	"/smart"           => env.GIT_EXEC_PATH + "/git-http-backend",
	"/auth/smart"      => env.GIT_EXEC_PATH + "/git-http-backend",
	"/auth-push/smart" => env.GIT_EXEC_PATH + "/git-http-backend",
)

setenv.add-environment = (
	"GIT_HTTP_EXPORT_ALL" => "",
	"GIT_PROJECT_ROOT"    => env.HTTPD_DOCUMENT_ROOT_PATH,
	"GIT_EXEC_PATH"       => env.GIT_EXEC_PATH,
)

$HTTP["url"] =~ "^/smart" {
	cgi.assign = ( "" => "" )
}

$HTTP["url"] =~ "^/auth/smart" {
	cgi.assign = ( "" => "" )
	auth.require = ( "" => (
		"method"  => "basic",
		"realm"   => "git-auth",
		"require" => "valid-user",
	) )
}

# Anonymous fetch, authenticated push: route the CGI for the whole prefix,
# but only require auth on the git-receive-pack (push) request.
$HTTP["url"] =~ "^/auth-push/smart" {
	cgi.assign = ( "" => "" )
}
$HTTP["url"] =~ "^/auth-push/.*/git-receive-pack$" {
	auth.require = ( "" => (
		"method"  => "basic",
		"realm"   => "git-auth",
		"require" => "valid-user",
	) )
}
