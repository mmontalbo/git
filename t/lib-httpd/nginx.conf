# Minimal nginx configuration template for Git's HTTP tests.
#
# Unlike apache.conf and lighttpd.conf, this is a *template*: nginx has no
# way to read values from the environment at config-parse time, so
# lib-httpd.sh substitutes the @TOKEN@ placeholders below into a concrete
# config before starting the server. Path values are double-quoted because
# the test trash directory name contains a space.
#
# nginx also has no native CGI, so git-http-backend is run through an
# fcgiwrap daemon that lib-httpd.sh starts alongside nginx and reaches over
# the Unix socket named here. Covered: smart and dumb HTTP, TLS + HTTP/2
# (when LIB_HTTPD_SSL is set), basic auth, and redirects. WebDAV, forward
# proxy and Subversion remain Apache-only.

daemon on;
worker_processes 1;
pid "@HTTPD_ROOT_PATH@/httpd.pid";
error_log "@HTTPD_ROOT_PATH@/error.log";

events { }

http {
	access_log "@HTTPD_ROOT_PATH@/access.log";

	# git pushes carry the whole pack in one request body; nginx caps that
	# at 1m by default and would reject larger pushes with 413 (the common
	# real-world "RPC failed; HTTP 413" seen with git behind nginx).
	client_max_body_size 0;

	client_body_temp_path "@HTTPD_ROOT_PATH@/client_body_temp";
	fastcgi_temp_path "@HTTPD_ROOT_PATH@/fastcgi_temp";
	proxy_temp_path "@HTTPD_ROOT_PATH@/proxy_temp";
	uwsgi_temp_path "@HTTPD_ROOT_PATH@/uwsgi_temp";
	scgi_temp_path "@HTTPD_ROOT_PATH@/scgi_temp";

	# Decide when basic auth is required, keyed on the request path:
	#  - everything under /auth/ (both fetch and push), and
	#  - only the push (git-receive-pack) under /auth-push/, leaving its
	#    fetch anonymous.
	# "off" elsewhere. This lets one git-http-backend location serve the
	# plain, authed and auth-push variants without duplicating the wiring.
	map $uri $git_auth_realm {
		~^/auth/                          "git-auth";
		~^/auth-push/.*/git-receive-pack$ "git-auth";
		default                           off;
	}

	server {
		# @LISTEN@ and @SSL_PARAMS@ are filled in by lib-httpd.sh:
		# plain HTTP, or "listen ... ssl" plus certificate and
		# "http2 on" when LIB_HTTPD_SSL is set.
		@LISTEN@
		@SSL_PARAMS@
		server_name localhost;
		root "@HTTPD_DOCUMENT_ROOT_PATH@";

		# Dumb HTTP: serve the repositories as static files.
		location /dumb/ {
			alias "@HTTPD_DOCUMENT_ROOT_PATH@/";
		}

		# Redirects: git must follow these to the real smart path.
		# $is_args$args preserves the ?service=... query string.
		location ~ ^/smart-redir-perm(/.*)$ {
			return 301 /smart$1$is_args$args;
		}
		location ~ ^/smart-redir-temp(/.*)$ {
			return 302 /smart$1$is_args$args;
		}

		# Smart HTTP, optionally behind basic auth under /auth/. nginx
		# cannot exec a CGI itself, so requests are forwarded over
		# FastCGI to fcgiwrap, which fork-execs git-http-backend.
		# A named capture (not positional $1) is required: referencing
		# $git_auth_realm evaluates the map above, whose successful regex
		# match for /auth/ paths would otherwise clear $1 before it
		# reaches PATH_INFO.
		location ~ ^(?:/auth|/auth-push)?/smart(?<git_path_info>/.*)$ {
			auth_basic           $git_auth_realm;
			auth_basic_user_file "@HTTPD_ROOT_PATH@/passwd";

			fastcgi_pass "unix:@HTTPD_ROOT_PATH@/fcgiwrap.sock";

			fastcgi_param SCRIPT_FILENAME "@GIT_EXEC_PATH@/git-http-backend";
			fastcgi_param GIT_HTTP_EXPORT_ALL "";
			fastcgi_param GIT_PROJECT_ROOT  "@HTTPD_DOCUMENT_ROOT_PATH@";
			fastcgi_param GIT_EXEC_PATH     "@GIT_EXEC_PATH@";
			fastcgi_param PATH_INFO         $git_path_info;

			fastcgi_param QUERY_STRING    $query_string;
			fastcgi_param REQUEST_METHOD  $request_method;
			fastcgi_param CONTENT_TYPE    $content_type;
			fastcgi_param CONTENT_LENGTH  $content_length;
			fastcgi_param SERVER_PROTOCOL $server_protocol;
			fastcgi_param REMOTE_ADDR     $remote_addr;
			fastcgi_param REMOTE_USER     $remote_user;
			fastcgi_param GIT_PROTOCOL    $http_git_protocol;
		}
	}
}
